<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UpLift</title>
  <link rel="stylesheet" href="logsign.css">
</head>
<body>

  <!-- Header -->
  <header>
    <h1>UpLift</h1>
  </header>

  <!-- Forms -->
  <div class="form-container">

 <!-- Login Form -->
<div class="form-box" id="login-section">
  <h2>Log In</h2>
  <button class="google-btn" id="googleLoginBtn">Log In with Google</button>
  
  <label for="login-email">Email:</label>
  <input type="email" id="login-email" placeholder="Enter your email">

  <label for="login-password">Password:</label>
  <input type="password" id="login-password" placeholder="Enter your password">

  <button id="loginBtn">Log In</button>
</div>

<!-- Sign Up Form -->
<div class="form-box" id="signup-section">
  <h2>Sign Up</h2>

  <label for="signup-name">Full Name:</label>
  <input type="text" id="signup-name" placeholder="Enter your full name">

  <label for="signup-email">Email:</label>
  <input type="email" id="signup-email" placeholder="Enter your email">

  <label for="signup-password">Password:</label>
  <input type="password" id="signup-password" placeholder="Enter your password">

  <label for="signup-repassword">Reconfirm Password:</label>
  <input type="password" id="signup-repassword" placeholder="Re-enter your password">

  <button id="signupBtn">Sign Up</button>
</div>

  </div>

  <!-- Footer -->
  <footer>
      <a href="resources.html" class="footer-link">Quick Links</a>
      <a href="resources.html" class="footer-link">FAQ</a>
      <a href="resources.html" class="footer-link">Contacts</a>
  </footer>

  <script src="logsign.js"></script>
</body>
</html>
